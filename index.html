<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1f2430;--muted:#6b7280;--line:#e3e6ec;--accent:#4f46e5;--accent-soft:#eef0ff;--red:#dc2626;--green:#16a34a;--orange:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#14161b;--panel:#1c1f26;--text:#e7e9ee;--muted:#9aa1ae;--line:#2d313b;--accent:#818cf8;--accent-soft:#25283a;--red:#f87171;--green:#4ade80;--orange:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.link{border:none;background:none;color:var(--muted);padding:2px 6px}
button.link:hover{color:var(--red)}
header{display:flex;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
header .logo{font-weight:700;font-size:18px;color:var(--accent)}
#capture{flex:2;border-color:var(--accent)}
#search{flex:1}
main{flex:1;display:flex;min-height:0}
nav{width:210px;padding:12px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;overflow:auto}
nav button{text-align:left;border:none;background:none;display:flex;justify-content:space-between;padding:9px 12px}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .sep{height:1px;background:var(--line);margin:8px 0}
nav .count{color:var(--muted);font-size:13px}
nav .foot{margin-top:auto;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#content{flex:1;overflow:auto;padding:20px 24px}
h2{margin:0 0 14px;font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 9px;font-size:12px;cursor:pointer}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
.late{color:var(--red);border-color:var(--red)}
.today{color:var(--orange);border-color:var(--orange)}
.done .title{text-decoration:line-through;color:var(--muted)}
.title{cursor:pointer}
.sub{margin:6px 0 0 30px;display:flex;flex-direction:column;gap:4px}
.empty{color:var(--muted);text-align:center;margin-top:50px}
.notes{display:flex;gap:16px;height:100%}
.notes .list{width:270px;overflow:auto;flex-shrink:0}
.notes .editor{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.notes textarea{flex:1;resize:none;font-family:Consolas,monospace;line-height:1.5}
.item{cursor:pointer}
.item.sel{border-color:var(--accent);background:var(--accent-soft)}
.pin{color:var(--orange)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1}
#banner{background:#fff4d6;color:#5b4300;padding:10px 16px;display:none;gap:12px;align-items:center}
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:290px;color:#fff;background:linear-gradient(135deg,#4f46e5,#9333ea 55%,#f59e0b);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;padding:20px 24px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.62));pointer-events:none}
.hero>*{position:relative}
.hero h1{margin:2px 0 4px;font-size:32px;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.hero .hdate{font-size:14px;opacity:.9;letter-spacing:.04em;text-transform:uppercase}
.hero .hsub{font-size:16px;opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.hero .htop{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero .hw{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:14px;padding:10px 14px;min-width:210px;max-width:290px}
.hero .hq{font-size:22px;font-style:italic;line-height:1.35;text-shadow:0 2px 10px rgba(0,0,0,.5);max-width:820px}
.hero .hbot{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.hero button.hb{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:4px 10px;border-radius:99px;font-size:13px}
.hero button.hb:hover{background:rgba(255,255,255,.32)}
.hero input{color:#1f2430;padding:3px 8px;width:150px}
.hplace{cursor:pointer;text-decoration:underline dotted}
.hwx{display:flex;align-items:center;gap:10px;margin-top:6px}
.hwx .big{font-size:38px;line-height:1}.hwx .t{font-size:28px;font-weight:700}
.hdays{display:flex;gap:8px;margin-top:8px;font-size:12px;justify-content:space-between}
.hdays div{text-align:center}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;align-items:start}
.hgrid h3{margin:0 0 8px;font-size:16px}
.hgoal{width:100%;resize:vertical;font-size:17px;line-height:1.45;min-height:84px}
.hring{display:flex;align-items:center;gap:14px;margin-top:10px}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.hstat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;cursor:pointer}
.hstat:hover{border-color:var(--accent)}
.hstat b{display:block;font-size:26px;line-height:1.1}
.hstat span{font-size:12px;color:var(--muted)}
.hweek{display:flex;gap:6px}
.hweek div{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:12px;color:var(--muted)}
.hweek div b{display:block;font-size:18px;color:var(--text)}
.hweek div.now{border-color:var(--accent);background:var(--accent-soft)}
.htask{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.htask:last-of-type{border-bottom:none}
.htask.done .title{text-decoration:line-through;color:var(--muted)}
.hbravo{color:var(--green);font-weight:600;margin:6px 0}
.mbox.marmo{width:min(560px,100%)}.marmohead{display:flex;align-items:flex-end;gap:12px}
.marmobubble{background:#fff7e6;border:2px solid #fde2a8;color:#3b2a10;border-radius:16px;padding:12px 16px;flex:1;line-height:1.4}.marmobubble b{font-size:19px;display:block}
.marmolist{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:42vh;overflow:auto}
.marmotask{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;background:var(--accent-soft);border-left:4px solid var(--line);min-height:44px}
.marmotask.p3{border-left-color:var(--red)}.marmotask.p2{border-left-color:var(--orange)}
.marmotask input{width:22px;height:22px;flex-shrink:0}
.marmosay{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:95;display:flex;align-items:flex-end;gap:8px;max-width:min(360px,calc(100vw - 32px));animation:marmoin .4s ease;transition:opacity .5s,transform .5s}
.marmosay.out{opacity:0;transform:translateY(20px)}
@keyframes marmoin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.marmosay{animation:none}}

<body>
<div id="banner"></div>
<header>
  <button id="btnNav" class="mobonly" data-action="navtoggle" title="Menu">☰</button>
  <span class="logo" data-action="nav" data-view="home" style="cursor:pointer" title="Accueil">🧠 Cerveau</span>
  <span class="spacer mobonly"></span>
  <button id="btnSearch" class="mobonly" data-action="searchtoggle" title="Rechercher">🔍</button>
  <input id="capture" placeholder="Noter une idée… (Ctrl+K) puis Entrée" autocomplete="off">
  <input id="search" placeholder="Rechercher… (touche /)" autocomplete="off">
  <button id="btnPostit" data-action="newPostit" title="Nouveau post-it (Alt+N)">🟨 Post-it</button>
  <span id="status" class="muted"></span>
</header>
<main>
  <nav id="nav"></nav>
  <div id="content"></div>
</main>
<div id="navShade" data-action="navclose"></div>
<div id="toast"></div>

<script>
"use strict";
// ---------- Outils ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const tomorrow = () => { const d = new Date(); d.setDate(d.getDate() + 1); return dstr(d); };
const parseTags = s => [...new Set(String(s).split(/[,\s]+/).map(t => t.replace(/^#/, '').trim()).filter(Boolean))];
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.remove('act'); t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); };

// ---------- Données ----------
const emptyData = () => ({ version: 1, updatedAt: 0, inbox: [], notes: [], tasks: [], seen: [], postits: [], boards: [], maps: [], ideas: [], habits: [], projects: [], trash: [], home: {} });
let data = emptyData();
try { const raw = localStorage.getItem('cerveau-data'); if (raw) data = Object.assign(emptyData(), JSON.parse(raw)); } catch (e) {}

let view = 'home', selNote = null, noteFolder = '', importOpen = false, lastNewPostit = null;
let dirHandle = null, saveTimer = null;
const HAS_FS = !!window.showDirectoryPicker;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
// ouvre une image en tenant compte de l'orientation (Safari ancien : repli sans option)
async function loadBitmap(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {}
  try { return await createImageBitmap(file); } catch (e) {}
  return await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { res(im); URL.revokeObjectURL(u); }; im.onerror = rej; im.src = u; });
}

function save() {
  data.updatedAt = Date.now();
  try { localStorage.setItem('cerveau-data', JSON.stringify(data)); } catch (e) {}
  setStatus(dirHandle ? 'Enregistrement…' : 'Enregistré (navigateur seulement)');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeFolder, 700);
}
function setStatus(t) { $('#status').textContent = t; }

// ---------- Dossier de sauvegarde (OneDrive) ----------
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open('cerveau', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => {
      const tx = r.result.transaction('kv', mode);
      const q = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(q && q.result);
      tx.onerror = () => rej(tx.error);
    };
  });
}
const safeName = s => (s || 'sans titre').replace(/[\\/:*?"<>|\r\n]+/g, ' ').trim().slice(0, 50) || 'sans titre';

async function writeFile(dir, name, content) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(content);
  await w.close();
}
async function writeFolder() {
  if (!dirHandle) return;
  try {
    await writeFile(dirHandle, 'data.json', JSON.stringify(data, null, 2));
    autoSnapshot();
    const nd = await dirHandle.getDirectoryHandle('notes', { create: true });
    const keep = new Set();
    for (const n of data.notes) {
      const name = safeName(n.title) + '__' + n.id + '.md';
      keep.add(name);
      const head = '---\ntitre: ' + (n.title || '') + '\ndossier: ' + (n.folder || '') + '\ntags: ' + n.tags.join(', ') + '\ncree: ' + fmtDT(n.created) + '\nmodifie: ' + fmtDT(n.updated || n.created) + '\n---\n\n';
      await writeFile(nd, name, head + (n.html ? rteConv(sanitizeHtml(n.html), true) : (n.body || '')));
    }
    for await (const [name] of nd.entries()) if (name.endsWith('.md') && !keep.has(name)) await nd.removeEntry(name);
    let md = '# Tâches\n\n';
    for (const t of data.tasks) {
      md += '- [' + (t.done ? 'x' : ' ') + '] ' + t.title + (t.due ? ' (échéance ' + t.due + ')' : '') + '\n';
      for (const s of t.subs) md += '  - [' + (s.done ? 'x' : ' ') + '] ' + s.title + '\n';
    }
    await writeFile(dirHandle, 'taches.md', md);
    let im = '# Idées\n';
    for (const [k, label] of ICOLS) { const c = data.ideas.filter(i => ideaStatus(i) === k); if (!c.length) continue; im += '\n## ' + label + '\n\n'; for (const i of c) im += '- ' + i.title + (i.tags.length ? ' ' + i.tags.map(t => '#' + t).join(' ') : '') + '\n' + (i.text ? '  ' + i.text.replace(/\n/g, '\n  ') + '\n' : ''); }
    await writeFile(dirHandle, 'idees.md', im);
    let pm = '# Post-it\n\n';
    for (const p of data.postits) if (p.text.trim()) pm += '- ' + p.text.trim().replace(/\n/g, '\n  ') + '\n';
    await writeFile(dirHandle, 'postits.md', pm);
    try { // une image PNG par tableau blanc (facile à partager depuis OneDrive)
      const bd = await dirHandle.getDirectoryHandle('tableaux', { create: true });
      const keepB = new Set();
      for (const b of data.boards) {
        const name = safeName(b.title) + '__' + b.id + '.png'; keepB.add(name);
        if (wbDirty.has(b.id)) { await writeFile(bd, name, await wbBlob(b)); wbDirty.delete(b.id); }
      }
      for await (const [name] of bd.entries()) if (name.endsWith('.png') && !keepB.has(name)) await bd.removeEntry(name);
    } catch (e) { console.error(e); }
    try { // une image + un plan texte (.md, lisible sur iPhone) par carte mentale
      const cd = await dirHandle.getDirectoryHandle('cartes', { create: true });
      const keepC = new Set();
      for (const m of data.maps) {
        const base = safeName(m.title) + '__' + m.id; keepC.add(base + '.png'); keepC.add(base + '.md');
        await writeFile(cd, base + '.md', mmMarkdown(m));
        if (mmDirty.has(m.id)) { await writeFile(cd, base + '.png', await mmBlob(m)); mmDirty.delete(m.id); }
      }
      for await (const [name] of cd.entries()) if (/\.(png|md)$/.test(name) && !keepC.has(name)) await cd.removeEntry(name);
    } catch (e) { console.error(e); }
    try { // les photos de la page d'accueil
      if (homePhotoDirty.size || homePhotoRemoved.size) {
        const ad = await dirHandle.getDirectoryHandle('accueil', { create: true });
        for (const id of [...homePhotoDirty]) { const p = homePhotos.get(id); if (p) await writeFile(ad, 'photo-' + id + '.jpg', p.blob); homePhotoDirty.delete(id); }
        for (const id of [...homePhotoRemoved]) { try { await ad.removeEntry('photo-' + id + '.jpg'); } catch (e) {} homePhotoRemoved.delete(id); }
      }
    } catch (e) { console.error(e); }

// Idées envoyées depuis l'iPhone : un fichier texte par idée dans le dossier "Inbox-iPhone"
let syncing = false;
async function syncInbox() {
  if (!dirHandle || syncing) return 0;
  syncing = true;
  let added = 0, merged = 0; const mergeLog = [];
  try {
    const dir = await dirHandle.getDirectoryHandle('Inbox-iPhone', { create: true });
    const seen = new Set(data.seen), todo = [];
    for await (const [name, h] of dir.entries()) {
      const ext = (name.match(/\.([A-Za-z][A-Za-z0-9]{0,4})$/) || [])[1]; // une date comme "20.41.35" n'est pas une extension
      if (h.kind !== 'file' || /^[.~]/.test(name) || (ext && !/^(txt|md|text|markdown|json)$/i.test(ext))) continue;
      const f = await h.getFile();
      if (/^json$/i.test(ext || '')) { // sauvegarde envoyée depuis l'iPhone : fusion automatique
        if (!f.size || f.size > 30e6) continue;
        let d; try { d = JSON.parse(await f.text()); } catch (e) { continue; }
        if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.notes)) continue;
        const jk = 'file:' + name + '|' + f.size + '|' + f.lastModified;
        if (!seen.has(jk)) { merged += mergeData(d); const ms = mergeSummary(); mergeLog.push(ms); const np = await mergePhotos(d); if (np) { merged += np; mergeLog.push(np + ' photo(s)'); } seen.add(jk); }
        todo.push([name, f]); continue;
      }
      if (!f.size || f.size > 200000) continue;
      const text = (await f.text()).replace(/^﻿/, '').trim();
      if (!text || /\u0000/.test(text)) continue;
      const key = 'file:' + name + '|' + f.size + '|' + f.lastModified;
      if (!seen.has(key)) { data.inbox.push({ id: uid(), text, created: f.lastModified }); seen.add(key); added++; }
      todo.push([name, f]);
    }
    if (merged) { data.seen = [...new Set([...(data.seen || []), ...seen])]; save(); toast('Reçu de l\'iPhone 📱 : ' + mergeLog.join(' + ')); added += merged; }
    if (added && !merged) {
      data.seen = [...seen]; data.inbox.sort((a, b) => b.created - a.created);
      save(); await writeFolder();
      toast(added + " idée(s) reçue(s) de l'iPhone 📱");
    }
    for (const [name, f] of todo) { // les fichiers lus sont rangés dans "importees" (rien n'est perdu)
      try {
        const arch = await dir.getDirectoryHandle('importees', { create: true });
        await writeFile(arch, f.lastModified + '_' + name, f);
        await dir.removeEntry(name);
      } catch (e) { console.error(e); }
    }
  } catch (e) { console.error(e); }
  syncing = false;
  return added;
}

let mergeStats = {};
const MERGE_LBL = { inbox: 'idée(s) Inbox', notes: 'note(s)', tasks: 'tâche(s)', postits: 'post-it', boards: 'tableau(x)', maps: 'carte(s) mentale(s)', ideas: 'idée(s)', habits: 'habitude(s)', projects: 'projet(s)', tpls: 'modèle(s) de tâches' };

  if (!curBoard()) wbBoardId = data.boards.slice().sort((a, b) => b.updated - a.updated)[0].id;
  const b = curBoard();
  const tools = [['pen', '✏️ Stylo', 'P'], ['line', '╱ Ligne', 'L'], ['arrow', '➜ Flèche', 'A'], ['rect', '▭ Rectangle', 'R'], ['ellipse', '◯ Ellipse', 'O'], ['text', '𝐓 Texte', 'T'], ['eraser', '🧽 Gomme', 'E']];
  $('#content').innerHTML = `<div class="row wbbar">
    <select id="wbSelect">${data.boards.map(x => `<option value="${x.id}" ${x.id === b.id ? 'selected' : ''}>${esc(x.title)}</option>`).join('')}</select>
    <button data-action="wbnew">+ Nouveau</button><button data-action="wbrename" title="Renommer">✎</button><button class="link" data-action="wbdel" title="Supprimer ce tableau">🗑</button>

    <button data-action="wbcopy" title="Copie l'image pour la coller dans un e-mail, Teams, Word…">📋 Copier l'image</button><button data-action="wbpng" title="Télécharge l'image">💾 PNG</button><button data-action="wbshare" title="Ouvre le partage Windows (si disponible)">📤 Partager</button></div>
    <div class="row wbbar">${tools.map(([k, l, s]) => `<button class="tool" data-action="wbtool" data-tool="${k}" title="${l.split(' ')[1]} (${s})">${l}</button>`).join('')}
    <span class="grow"></span>
    ${WB_COLORS.map(c => `<button class="swatch" data-action="wbcolor" data-color="${c}" style="background:${c}" title="Couleur"></button>`).join('')}
    ${[2, 5, 10].map(w => `<button class="size" data-action="wbsize" data-size="${w}" title="Épaisseur"><span style="display:inline-block;width:${w + 4}px;height:${w + 4}px;border-radius:50%;background:currentColor"></span></button>`).join('')}
    </div>

    <p class="muted" style="text-align:center">Raccourcis : P stylo · L ligne · A flèche · R rectangle · O ellipse · T texte · E gomme · Ctrl+Z annuler.${dirHandle ? ' Image enregistrée aussi dans le dossier « tableaux ».' : ''}</p>`;
  wbBind($('#wb')); wbDraw(); wbUI();
}
async function wbCopy() {
  const b = curBoard();
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': await wbBlob(b) })]); toast('Image copiée : colle-la avec Ctrl+V (e-mail, Teams, Word…)'); }
  catch (e) { console.error(e); toast('Copie impossible ici : utilise « PNG »'); }
}
async function wbDownload() {
  const b = curBoard(), a = document.createElement('a');
  a.href = URL.createObjectURL(await wbBlob(b)); a.download = safeName(b.title) + '.png'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function wbShare() {
  const b = curBoard(), file = new File([await wbBlob(b)], safeName(b.title) + '.png', { type: 'image/png' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: b.title });
    else toast("Partage direct indisponible : utilise « Copier l'image » ou « PNG »");
  } catch (e) { if (e.name !== 'AbortError') toast("Partage impossible : utilise « Copier l'image »"); }
}

// ---------- Carte mentale ----------
const MM = { gapX: 56, gapY: 12, colors: ['#2563eb', '#16a34a', '#d97706', '#dc2626', '#9333ea', '#0891b2', '#db2777', '#65a30d'] };
const mmCtx = document.createElement('canvas').getContext('2d');
let mmMapId = null, mmSel = null, mmEditing = null, mmImportOpen = false, mmLay = new Map();
const mmViews = {}, mmHistory = {}, mmDirty = new Set();
const curMap = () => data.maps.find(x => x.id === mmMapId);
const taskOf = n => n.task ? data.tasks.find(t => t.id === n.task) : null;
const mapBtn = t => (t.mapId && data.maps.some(x => x.id === t.mapId)) ? `<button class="link" title="Voir dans la carte mentale" data-action="gotoMap" data-id="${t.mapId}" data-node="${esc(t.mapNode)}">🧠</button>` : '';
const mmTag = s => s.toLowerCase().replace(/[^a-z0-9àâäçéèêëîïôöùûüœ]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24);
const mmFS = d => d === 0 ? 20 : d === 1 ? 16 : 14;
function mmFind(n, id) { if (n.id === id) return n; for (const c of n.children) { const r = mmFind(c, id); if (r) return r; } return null; }
function mmParent(n, id) { for (let i = 0; i < n.children.length; i++) { const c = n.children[i]; if (c.id === id) return { parent: n, index: i }; const r = mmParent(c, id); if (r) return r; } return null; }
function mmNewMap() {
  const m = { id: uid(), title: 'Carte ' + (data.maps.length + 1), root: { id: uid(), text: 'Idée centrale', children: [], collapsed: false }, created: Date.now(), updated: Date.now() };
  data.maps.push(m); mmDirty.add(m.id); return m;
}
const mmHist = m => mmHistory[m.id] || (mmHistory[m.id] = { undo: [], redo: [] });
function mmPushSnapshot(m) { const h = mmHist(m); h.undo.push(JSON.stringify(m.root)); if (h.undo.length > 60) h.undo.shift(); h.redo = []; }
function mmChanged(m) { m.updated = Date.now(); mmDirty.add(m.id); save(); }
function mmUndo() { const m = curMap(), h = m && mmHistory[m.id]; if (!h || !h.undo.length) return; h.redo.push(JSON.stringify(m.root)); m.root = JSON.parse(h.undo.pop()); if (!mmFind(m.root, mmSel)) mmSel = m.root.id; mmChanged(m); mmDraw(); }
function mmRedo() { const m = curMap(), h = m && mmHistory[m.id]; if (!h || !h.redo.length) return; h.undo.push(JSON.stringify(m.root)); m.root = JSON.parse(h.redo.pop()); if (!mmFind(m.root, mmSel)) mmSel = m.root.id; mmChanged(m); mmDraw(); }

// --- mise en page automatique : l'idée centrale au milieu, les branches de chaque côté
function mmEnsure(m) {
  const kids = m.root.children;
  kids.forEach((c, i) => {
    if (c.side !== 1 && c.side !== -1) { const r = kids.filter(x => x.side === 1).length, l = kids.filter(x => x.side === -1).length; c.side = r <= l ? 1 : -1; }
    if (!c.c) c.c = MM.colors[i % MM.colors.length];
  });
}
function mmMeasure(n, d) {
  mmCtx.font = `${d <= 1 ? 'bold ' : ''}${mmFS(d)}px "Segoe UI", system-ui, sans-serif`;
  const words = (n.text || ' ').split(/\s+/).filter(Boolean), lines = []; let cur = '';
  for (const w of (words.length ? words : [' '])) { const t = cur ? cur + ' ' + w : w; if (cur && mmCtx.measureText(t).width > 220) { lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur);
  const lh = Math.round(mmFS(d) * 1.25), badge = taskOf(n) ? 22 : 0, tw = Math.max(...lines.map(l => mmCtx.measureText(l).width));
  return { lines, lh, badge, w: Math.ceil(tw) + 24 + badge, h: lines.length * lh + (d === 0 ? 20 : 12) };
}
function mmSize(n, d, lay) {
  const e = { n, depth: d, ...mmMeasure(n, d), H: 0 }; lay.set(n.id, e);
  const kids = n.collapsed ? [] : n.children; let sum = 0;
  for (const c of kids) { mmSize(c, d + 1, lay); sum += lay.get(c.id).H; }
  sum += Math.max(0, kids.length - 1) * MM.gapY; e.H = Math.max(e.h, sum);
}
function mmPlace(n, side, x, yc, color, lay) {
  const e = lay.get(n.id); e.side = side; e.color = color; e.x = side > 0 ? x : x - e.w; e.y = yc - e.h / 2;
  const kids = n.collapsed ? [] : n.children; if (!kids.length) return;
  const total = kids.reduce((s, c) => s + lay.get(c.id).H, 0) + (kids.length - 1) * MM.gapY; let y = yc - total / 2;
  for (const c of kids) { const ce = lay.get(c.id); mmPlace(c, side, side > 0 ? e.x + e.w + MM.gapX : e.x - MM.gapX, y + ce.H / 2, color, lay); y += ce.H + MM.gapY; }
}
function mmLayout(m) {
  mmEnsure(m);
  const lay = new Map(), root = m.root; mmSize(root, 0, lay);
  const re = lay.get(root.id); re.x = -re.w / 2; re.y = -re.h / 2; re.side = 0; re.color = '#1f2430';
  const kids = root.collapsed ? [] : root.children;
  for (const side of [1, -1]) {
    const group = kids.filter(c => c.side === side); if (!group.length) continue;
    const total = group.reduce((s, c) => s + lay.get(c.id).H, 0) + (group.length - 1) * MM.gapY; let y = -total / 2;
    for (const c of group) { const ce = lay.get(c.id); mmPlace(c, side, side * (re.w / 2 + MM.gapX), y + ce.H / 2, c.c, lay); y += ce.H + MM.gapY; }
  }
  return lay;
}
function mmBBox(lay) {
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  for (const e of lay.values()) { x1 = Math.min(x1, e.x - 24); y1 = Math.min(y1, e.y); x2 = Math.max(x2, e.x + e.w + 24); y2 = Math.max(y2, e.y + e.h); }
  return { x1, y1, x2, y2, w: x2 - x1, h: y2 - y1 };
}

// --- dessin (SVG)
function mmNodeSvg(n, e, o) {
  const d = e.depth, t = taskOf(n), sel = !o.export && o.selId === n.id;
  const fill = d === 0 ? '#1f2430' : d === 1 ? e.color : '#ffffff', tc = d <= 1 ? '#ffffff' : '#1f2430', stroke = d >= 2 ? e.color : 'none';
  const rx = d === 0 ? 14 : d === 1 ? 10 : 8, tx = e.x + 12 + e.badge, ty0 = e.y + (d === 0 ? 10 : 6);
  let s = `<g class="mmnode" data-node="${n.id}" data-action="mmsel" data-id="${n.id}">`;
  if (sel) s += `<rect x="${e.x - 4}" y="${e.y - 4}" width="${e.w + 8}" height="${e.h + 8}" rx="${rx + 4}" fill="none" stroke="#4f46e5" stroke-width="3"/>`;
  s += `<rect class="body" x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
  s += `<text font-family="Segoe UI, system-ui, sans-serif" font-size="${mmFS(d)}" font-weight="${d <= 1 ? 700 : 400}" fill="${tc}">` +
    e.lines.map((l, i) => `<tspan x="${tx}" y="${ty0 + e.lh * (i + 0.78)}">${esc(l)}</tspan>`).join('') + '</text>';
  if (t) {
    const bx = e.x + 8, by = e.y + e.h / 2 - 8, col = t.done ? '#16a34a' : '#6b7280';
    s += `<rect data-action="mmtaskdone" data-id="${n.id}" x="${bx}" y="${by}" width="16" height="16" rx="4" fill="#fff" stroke="${col}" stroke-width="2"><title>${t.done ? 'Tâche terminée' : 'Tâche à faire'} : clic pour changer</title></rect>`;
    if (t.done) s += `<path d="M${bx + 3.5} ${by + 8.5} l3.5 3.5 l6 -7" stroke="${col}" stroke-width="2.5" fill="none" pointer-events="none"/>`;
  }
  if (d >= 1 && n.children.length && (!o.export || n.collapsed)) {
    const cx = e.side > 0 ? e.x + e.w + 12 : e.x - 12, cy = e.y + e.h / 2;
    s += `<g data-action="mmcollapse" data-id="${n.id}"><circle cx="${cx}" cy="${cy}" r="9" fill="#fff" stroke="${e.color}" stroke-width="2"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="${e.color}" pointer-events="none">${n.collapsed ? n.children.length : '−'}</text></g>`;
  }
  return s + '</g>';
}
function mmInner(m, lay, o) {
  let paths = '', nodes = '';
  const walk = (n, pe) => {
    const e = lay.get(n.id);
    if (pe) {
      const sd = e.side, x1 = sd > 0 ? pe.x + pe.w : pe.x, y1 = pe.y + pe.h / 2, x2 = sd > 0 ? e.x : e.x + e.w, y2 = e.y + e.h / 2, dx = Math.abs(x2 - x1) * 0.5;
      paths += `<path d="M${x1} ${y1} C${x1 + sd * dx} ${y1} ${x2 - sd * dx} ${y2} ${x2} ${y2}" stroke="${e.color}" stroke-width="${e.depth === 1 ? 4 : 2.5}" fill="none" stroke-linecap="round"/>`;
    }
    nodes += mmNodeSvg(n, e, o);
    if (!n.collapsed) n.children.forEach(c => walk(c, e));
  };
  walk(m.root, null);
  return paths + nodes;
}
function mmDraw() {
  const m = curMap(), g = $('#mmG'); if (!m || !g) return;
  mmLay = mmLayout(m);
  if (!mmViews[m.id]) mmFit(m);
  g.innerHTML = mmInner(m, mmLay, { selId: mmSel });
  mmApplyView();
}
function mmApplyView() { const m = curMap(), g = $('#mmG'), v = m && mmViews[m.id]; if (g && v) g.setAttribute('transform', `translate(${v.x} ${v.y}) scale(${v.k})`); }
function mmFit(m) {
  const svg = $('#mm'); if (!svg) return;
  const r = svg.getBoundingClientRect(), b = mmBBox(mmLay), k = Math.max(0.15, Math.min(window.innerWidth < 820 ? 0.9 : 1.3, (r.width - 60) / b.w, (r.height - 60) / b.h));
  mmViews[m.id] = { k, x: (r.width - b.w * k) / 2 - b.x1 * k, y: (r.height - b.h * k) / 2 - b.y1 * k };
}
function mmZoom(f, cx, cy) {
  const m = curMap(), v = m && mmViews[m.id], svg = $('#mm'); if (!v) return;
  const r = svg.getBoundingClientRect(); if (cx == null) { cx = r.width / 2; cy = r.height / 2; }
  const k = Math.max(0.1, Math.min(3, v.k * f)); v.x = cx - (cx - v.x) * (k / v.k); v.y = cy - (cy - v.y) * (k / v.k); v.k = k; mmApplyView();
}
function mmReveal(id) {
  const m = curMap(), v = m && mmViews[m.id], svg = $('#mm'), el = document.querySelector(`#mmG [data-node="${id}"] rect.body`); if (!v || !svg || !el) return;
  const r = svg.getBoundingClientRect(), n = el.getBoundingClientRect(); let dx = 0, dy = 0;
  if (n.left < r.left + 20) dx = r.left + 20 - n.left; else if (n.right > r.right - 20) dx = r.right - 20 - n.right;
  if (n.top < r.top + 20) dy = r.top + 20 - n.top; else if (n.bottom > r.bottom - 20) dy = r.bottom - 20 - n.bottom;
  if (dx || dy) { v.x += dx; v.y += dy; mmApplyView(); }
}
function mmBind(svg) {
  svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); mmZoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  let pan = null;
  svg.addEventListener('pointerdown', e => {
    if ((e.target.closest && e.target.closest('[data-node]')) || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const v = mmViews[mmMapId]; if (!v) return;
    pan = { x: e.clientX, y: e.clientY, vx: v.x, vy: v.y }; svg.setPointerCapture(e.pointerId); svg.classList.add('panning');
  });
  svg.addEventListener('pointermove', e => { if (!pan) return; const v = mmViews[mmMapId]; v.x = pan.vx + e.clientX - pan.x; v.y = pan.vy + e.clientY - pan.y; mmApplyView(); });
  const stop = () => { pan = null; svg.classList.remove('panning'); };
  svg.addEventListener('pointerup', stop); svg.addEventListener('pointercancel', stop);
}

// --- modification (clavier et boutons)
function mmAdd(m, parent, afterId) {
  const snap = JSON.stringify(m.root), n = { id: uid(), text: '', children: [], collapsed: false };
  if (parent === m.root) {
    const sib = afterId && parent.children.find(c => c.id === afterId);
    const r = parent.children.filter(c => c.side === 1).length, l = parent.children.filter(c => c.side === -1).length;
    n.side = sib ? sib.side : (r <= l ? 1 : -1); n.c = MM.colors[parent.children.length % MM.colors.length];
  }
  parent.collapsed = false;
  if (afterId) parent.children.splice(parent.children.findIndex(c => c.id === afterId) + 1, 0, n); else parent.children.push(n);
  mmSel = n.id; mmDraw(); mmReveal(n.id); mmEdit(n.id, { isNew: true, snap, parentId: parent.id });
}
function mmAddChild() { const m = curMap(); if (!m) return; mmAdd(m, mmFind(m.root, mmSel) || m.root, null); }
function mmAddSibling() {
  const m = curMap(); if (!m) return; const n = mmFind(m.root, mmSel) || m.root;
  if (n === m.root) return mmAdd(m, n, null);
  mmAdd(m, mmParent(m.root, n.id).parent, n.id);
}
function mmEdit(id, opts = {}) {
  const m = curMap(), wrap = $('#mmWrap'), body = document.querySelector(`#mmG [data-node="${id}"] rect.body`), n = m && mmFind(m.root, id);
  if (!m || !wrap || !body || !n) return;
  const wr = wrap.getBoundingClientRect(), r = body.getBoundingClientRect(), e = mmLay.get(id), v = mmViews[m.id];
  const inp = document.createElement('input'); inp.id = 'mmEdit'; inp.className = 'mmedit'; inp.value = n.text; inp.autocomplete = 'off';
  inp.style.cssText = `left:${r.left - wr.left}px;top:${r.top - wr.top}px;width:${Math.max(r.width, 160)}px;height:${Math.max(r.height, 28)}px;font-size:${mmFS(e.depth) * v.k}px`;
  wrap.appendChild(inp); inp.focus(); inp.select(); mmEditing = id;
  let closing = false;
  const finish = next => {
    if (closing) return; closing = true; mmEditing = null;
    const text = inp.value.trim(); inp.remove();
    const m2 = curMap(), n2 = m2 && mmFind(m2.root, id); if (!n2) return;
    let retitled = false;
    if (opts.isNew) {
      if (!text) { const p = mmParent(m2.root, id); if (p) p.parent.children.splice(p.index, 1); mmSel = opts.parentId || m2.root.id; mmDraw(); return; }
      const h = mmHist(m2); h.undo.push(opts.snap); h.redo = []; n2.text = text; mmChanged(m2);
    } else if (text && text !== n2.text) {
      mmPushSnapshot(m2); n2.text = text;
      if (n2 === m2.root && /^Carte \d+$/.test(m2.title)) { m2.title = text; retitled = true; }
      mmChanged(m2);
    }
    if (retitled) renderMind(); else mmDraw();
    if (next === 'sibling') mmAddSibling(); else if (next === 'child') mmAddChild();
  };
  inp.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') { ev.preventDefault(); finish('sibling'); }
    else if (ev.key === 'Tab') { ev.preventDefault(); finish('child'); }
    else if (ev.key === 'Escape') { if (opts.isNew) inp.value = ''; else inp.value = n.text; finish(); }
  });
  inp.addEventListener('blur', () => finish());
}
function mmToggle(id) {
  const m = curMap(), n = m && mmFind(m.root, id); if (!n || !n.children.length || n === m.root) return;
  mmPushSnapshot(m); n.collapsed = !n.collapsed; mmChanged(m); mmDraw();
}
function mmDeleteSel() {
  const m = curMap(), n = m && mmFind(m.root, mmSel); if (!n) return;
  if (n === m.root) { toast("L'idée centrale ne peut pas être supprimée (utilise 🗑 pour la carte entière)"); return; }
  const count = (function c(x) { return x.children.reduce((s, y) => s + 1 + c(y), 0); })(n);
  if (count && !confirm('Supprimer cet élément et ses ' + count + ' sous-élément(s) ? (Ctrl+Z pour annuler)')) return;
  const p = mmParent(m.root, n.id); mmPushSnapshot(m); p.parent.children.splice(p.index, 1);
  mmSel = p.parent.children[p.index] ? p.parent.children[p.index].id : p.parent.id; mmChanged(m); mmDraw();
}
function mmNav(key) {
  const m = curMap(), sel = mmFind(m.root, mmSel) || m.root, e = mmLay.get(sel.id), info = mmParent(m.root, sel.id), kids = sel.collapsed ? [] : sel.children;
  let target = null;
  if (key === 'ArrowRight' || key === 'ArrowLeft') {
    const dir = key === 'ArrowRight' ? 1 : -1;
    if (sel === m.root) target = kids.find(c => c.side === dir); else if (e.side === dir) target = kids[0]; else target = info && info.parent;
  } else if (info) {
    const sibs = info.parent === m.root ? info.parent.children.filter(c => c.side === e.side) : info.parent.children;
    target = sibs[sibs.indexOf(sel) + (key === 'ArrowDown' ? 1 : -1)];
  }
  if (target) { mmSel = target.id; mmDraw(); mmReveal(target.id); }
}
function mmKey(e) {
  const m = curMap(); if (!m || mmEditing) return false;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const l = k.toLowerCase();
    if (l === 'z' && !e.shiftKey) { e.preventDefault(); mmUndo(); return true; }
    if (l === 'y' || (l === 'z' && e.shiftKey)) { e.preventDefault(); mmRedo(); return true; }
    return false;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  if (k === 'Tab') { e.preventDefault(); mmAddChild(); return true; }
  if (k === 'Enter') { e.preventDefault(); mmAddSibling(); return true; }
  if (k === 'F2') { e.preventDefault(); mmEdit(mmSel); return true; }
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); mmDeleteSel(); return true; }
  if (k === ' ') { e.preventDefault(); mmToggle(mmSel); return true; }
  if (k.toLowerCase() === 't') { mmTask(false); return true; }
  if (k.startsWith('Arrow')) { e.preventDefault(); mmNav(k); return true; }

}
document.addEventListener('dblclick', e => {
  if (view !== 'mind' || !e.target.closest) return;
  if (e.target.closest('[data-action="mmtaskdone"],[data-action="mmcollapse"]')) return;
  const g = e.target.closest('#mmG [data-node]'); if (g) { mmSel = g.dataset.node; mmDraw(); mmEdit(g.dataset.node); }
});

// --- liaison avec les tâches
function mmMakeTask(m, n, withSubs) {
  const t = { id: uid(), title: n.text, due: '', prio: 2, tags: [...new Set(['carte', mmTag(m.title)].filter(Boolean))], status: 'todo', done: false, subs: [], created: Date.now(), mapId: m.id, mapNode: n.id };
  if (withSubs) n.children.forEach(c => { if (c.text.trim()) t.subs.push({ id: uid(), title: c.text, done: false }); });
  data.tasks.push(t); n.task = t.id; return t;

function mmTask(branch) {

// --- importer un plan (liste indentée collée depuis OneNote, un e-mail, etc.)
function mmParsePlan(text) {
  const rows = text.split(/\r?\n/).filter(l => l.trim()).map(l => {
    const mt = l.match(/^(\s*)(.*)$/);
    return { ind: mt[1].replace(/\t/g, '    ').length, t: mt[2].replace(/^(?:[-*•–]|\d+[.)])\s+/, '').trim() };
  }).filter(r => r.t);
  const levels = [...new Set(rows.map(r => r.ind))].sort((a, b) => a - b);
  const top = { children: [] }, stack = [{ lvl: -1, node: top }];
  for (const r of rows) {
    const lvl = levels.indexOf(r.ind); while (stack[stack.length - 1].lvl >= lvl) stack.pop();
    const n = { id: uid(), text: r.t, children: [], collapsed: false };
    stack[stack.length - 1].node.children.push(n); stack.push({ lvl, node: n });
  }
  return top.children;
}
function mmDoImport() {
  const m = curMap(), t = $('#mmImpText'), nodes = mmParsePlan(t ? t.value : '');
  if (!nodes.length) { toast("Colle d'abord une liste"); return; }
  const n = mmFind(m.root, mmSel) || m.root, count = (function c(a) { return a.reduce((s, x) => s + 1 + c(x.children), 0); })(nodes);
  mmPushSnapshot(m); n.children.push(...nodes); n.collapsed = false; mmImportOpen = false; mmChanged(m); renderMind(); toast(count + ' élément(s) ajouté(s)');
}

}

function tplParse(txt) {
  const out = [];

    const m = l.match(/^(.*?)\s*\|\s*([+-]?\d+)\s*$/);
    out.push({ title: (m ? m[1] : l).trim(), off: m ? parseInt(m[2], 10) : null, subs: [] });
  }
  return out.filter(x => x.title);
}

function tplApply(id) {

function parseCSV(text, delim) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function parseDate(v) {
  v = String(v || '').trim(); if (!v) return Date.now();
  let m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:[ T,]+(\d{1,2}):(\d{2}))?/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();
  const t = new Date(v).getTime(); return isNaN(t) ? Date.now() : t;
}
function parseIdeas(text) {
  text = String(text || '').replace(/^﻿/, '').trim();
  if (!text) return [];
  const first = text.split(/\r?\n/)[0];
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0];
  if (delim[1] > 1 && /date|id[ée]e|texte|text|contenu|description|titre|idea/i.test(first)) {
    const rows = parseCSV(text, delim[0]);
    const head = rows.shift().map(h => h.trim().toLowerCase());
    let ci = head.findIndex(h => /id[ée]e|texte|text|contenu|description|idea/.test(h));
    if (ci < 0) ci = head.findIndex(h => /titre|title/.test(h));
    if (ci < 0) ci = head.findIndex(h => !/date|heure|time/.test(h));
    const di = head.findIndex(h => /date|created|capture/.test(h));
    return rows.map(r => ({ text: (r[ci] || '').trim(), created: di >= 0 ? parseDate(r[di]) : Date.now() })).filter(x => x.text);
  }
  return text.split(/\r?\n/).map(l => l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim()).filter(Boolean).map(t => ({ text: t, created: Date.now() }));
}
function importIdeas(text) {
  const ideas = parseIdeas(text);
  const seen = new Set(data.seen), key = t => t.trim().toLowerCase();
  let added = 0, skipped = 0;
  for (const i of ideas) {
    if (seen.has(key(i.text))) { skipped++; continue; }
    seen.add(key(i.text)); data.inbox.push({ id: uid(), text: i.text, created: i.created }); added++;
  }
  data.seen = [...seen];
  data.inbox.sort((a, b) => b.created - a.created);
  save(); render();
  toast(added + ' idée(s) importée(s)' + (skipped ? ', ' + skipped + ' déjà connue(s)' : ''));
}

  if (el.id === 'capture') {
    const v = el.value.trim(); if (!v) return;
    data.inbox.unshift({ id: uid(), text: v, created: Date.now() }); el.value = ''; save(); toast('Ajouté à l\'Inbox ✓');
    if (view === 'inbox' && !$('#search').value.trim()) render(); else renderNav();
  } else if (el.id === 'prjName') { createProject();
  } else if (el.id === 'prjNewTask') {
    const v = el.value.trim(); if (!v) return; addTask(v, '', 2, []); const t = data.tasks[data.tasks.length - 1]; t.project = projId; t.updated = Date.now(); save(); renderProject(); const a = $('#prjNewTask'); if (a) a.focus();
  } else if (el.id === 'prjNewIdea') {
    const v = el.value.trim(); if (!v) return; const i = addIdea(v); i.project = projId; save(); renderProject(); const a = $('#prjNewIdea'); if (a) a.focus();
  } else if (el.id === 'hNewHab') {
    const v = el.value.trim(); if (!v) return;
    HAB().push({ id: uid(), name: v, days: {}, created: Date.now(), updated: Date.now() }); save(); renderHome(); const a = $('#hNewHab'); if (a) a.focus();
  } else if (el.id === 'hNewTask') {
    const v = el.value.trim(); if (!v) return;
    addTask(v, today(), 2, []); render(); const a = $('#hNewTask'); if (a) a.focus();
  } else if (el.id === 'newTask') {
    const v = el.value.trim(); if (!v) return;
    addTask(v, $('#newDue').value, $('#newPrio').value, parseTags($('#newTags').value));
    { const t = data.tasks[data.tasks.length - 1], tm = $('#newTime').value, rp = $('#newRepeat').value; if (tm) t.time = tm; if (rp) { t.repeat = rp; if (!t.due) t.due = today(); } if (tm || rp) save(); }
    render();
  } else if (el.id === 'calNew') {
    const v = el.value.trim(); if (!v) return; addTask(v, calSel, 2, []); const t = data.tasks[data.tasks.length - 1], tm = $('#calNewTime').value; if (tm) { t.time = tm; save(); } renderCalendar(); const a = $('#calNew'); if (a) a.focus();
  } else if (el.id === 'ntTitle') {
    ntCreate();
  } else if (el.id === 'ideaNew') {
    ideaAddFrom(el, null);
  } else if (el.dataset.iadd) {
    ideaAddFrom(el, el.dataset.iadd);
  } else if (el.dataset.kadd) {
    const v = el.value.trim(); if (!v) return;
    const col = el.dataset.kadd; addTask(v, '', 2, [], col); render();
    const again = document.querySelector(`[data-kadd="${col}"]`); if (again) again.focus();
  } else if (el.dataset.sub) {
    const v = el.value.trim(); if (!v) return;
    data.tasks.find(t => t.id === el.dataset.sub).subs.push({ id: uid(), title: v, done: false }); save(); render();
    const again = document.querySelector(`[data-sub="${el.dataset.sub}"]`); if (again) again.focus();
  }
});

// ---------- Glisser-déposer (Kanban) ----------
const colOf = e => (e.target && e.target.closest) ? e.target.closest('[data-col]') : null;
const clearOver = () => document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over'));
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('[data-drag]'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', e => { const col = colOf(e); if (!col) return; e.preventDefault(); clearOver(); col.classList.add('over'); });
document.addEventListener('drop', e => {
  const col = colOf(e); if (!col) return; e.preventDefault(); clearOver();
  const t = data.tasks.find(x => x.id === e.dataTransfer.getData('text/plain'));
  if (t && taskStatus(t) !== col.dataset.col) { setTaskStatus(t, col.dataset.col); save(); render(); }
});
document.addEventListener('dragend', clearOver);
document.addEventListener('dragover', e => { if (e.target.closest && e.target.closest('#nBody') && [...(e.dataTransfer.types || [])].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { const ed = e.target.closest && e.target.closest('#nBody'); if (!ed) return; const f = [...(e.dataTransfer.files || [])].filter(x => /^image\//.test(x.type)); if (!f.length) return; e.preventDefault(); rtInsertImages(f); });

// Quand on revient sur la fenêtre Cerveau, on regarde si de nouvelles idées sont arrivées de l'iPhone
window.addEventListener('focus', async () => {
  if (await syncInbox()) { if (view === 'inbox' && !$('#search').value.trim()) render(); else renderNav(); }
});

// ---------- Démarrage ----------
render();
setStatus('Enregistré (navigateur seulement)');
Promise.resolve(initFolder()).catch(() => {}).then(() => { setTimeout(marmoMorning, 700); autoSnapshot(); });
loadHomePhoto();
if (window.matchMedia('(max-width:820px)').matches) $('#capture').placeholder = 'Noter une idée… puis Entrée';
// Appli installable (iPhone/Android) : seulement quand la page est servie en https
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  try { const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l); navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
</script>
