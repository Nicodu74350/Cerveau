<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1f2430;--muted:#6b7280;--line:#e3e6ec;--accent:#4f46e5;--accent-soft:#eef0ff;--red:#dc2626;--green:#16a34a;--orange:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#14161b;--panel:#1c1f26;--text:#e7e9ee;--muted:#9aa1ae;--line:#2d313b;--accent:#818cf8;--accent-soft:#25283a;--red:#f87171;--green:#4ade80;--orange:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.link{border:none;background:none;color:var(--muted);padding:2px 6px}
button.link:hover{color:var(--red)}
header{display:flex;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
header .logo{font-weight:700;font-size:18px;color:var(--accent)}
#capture{flex:2;border-color:var(--accent)}
#search{flex:1}
main{flex:1;display:flex;min-height:0}
nav{width:210px;padding:12px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;overflow:auto}
nav button{text-align:left;border:none;background:none;display:flex;justify-content:space-between;padding:9px 12px}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .sep{height:1px;background:var(--line);margin:8px 0}
nav .count{color:var(--muted);font-size:13px}
nav .foot{margin-top:auto;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#content{flex:1;overflow:auto;padding:20px 24px}
h2{margin:0 0 14px;font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 9px;font-size:12px;cursor:pointer}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
.late{color:var(--red);border-color:var(--red)}
.today{color:var(--orange);border-color:var(--orange)}
.done .title{text-decoration:line-through;color:var(--muted)}
.title{cursor:pointer}
.sub{margin:6px 0 0 30px;display:flex;flex-direction:column;gap:4px}
.empty{color:var(--muted);text-align:center;margin-top:50px}
.notes{display:flex;gap:16px;height:100%}
.notes .list{width:270px;overflow:auto;flex-shrink:0}
.notes .editor{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.notes textarea{flex:1;resize:none;font-family:Consolas,monospace;line-height:1.5}
.item{cursor:pointer}
.item.sel{border-color:var(--accent);background:var(--accent-soft)}
.pin{color:var(--orange)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1}
#banner{background:#fff4d6;color:#5b4300;padding:10px 16px;display:none;gap:12px;align-items:center}
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:290px;color:#fff;background:linear-gradient(135deg,#4f46e5,#9333ea 55%,#f59e0b);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;padding:20px 24px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.62));pointer-events:none}
.hero>*{position:relative}
.hero h1{margin:2px 0 4px;font-size:32px;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.hero .hdate{font-size:14px;opacity:.9;letter-spacing:.04em;text-transform:uppercase}
.hero .hsub{font-size:16px;opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.hero .htop{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero .hw{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:14px;padding:10px 14px;min-width:210px;max-width:290px}
.hero .hq{font-size:22px;font-style:italic;line-height:1.35;text-shadow:0 2px 10px rgba(0,0,0,.5);max-width:820px}
.hero .hbot{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.hero button.hb{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:4px 10px;border-radius:99px;font-size:13px}
.hero button.hb:hover{background:rgba(255,255,255,.32)}
.hero input{color:#1f2430;padding:3px 8px;width:150px}
.hplace{cursor:pointer;text-decoration:underline dotted}
.hwx{display:flex;align-items:center;gap:10px;margin-top:6px}
.hwx .big{font-size:38px;line-height:1}.hwx .t{font-size:28px;font-weight:700}
.hdays{display:flex;gap:8px;margin-top:8px;font-size:12px;justify-content:space-between}
.hdays div{text-align:center}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;align-items:start}
.hgrid h3{margin:0 0 8px;font-size:16px}
.hgoal{width:100%;resize:vertical;font-size:17px;line-height:1.45;min-height:84px}
.hring{display:flex;align-items:center;gap:14px;margin-top:10px}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.hstat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;cursor:pointer}
.hstat:hover{border-color:var(--accent)}
.hstat b{display:block;font-size:26px;line-height:1.1}
.hstat span{font-size:12px;color:var(--muted)}
.hweek{display:flex;gap:6px}
.hweek div{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 2px;font-size:12px;color:var(--muted)}
.hweek div b{display:block;font-size:18px;color:var(--text)}
.hweek div.now{border-color:var(--accent);background:var(--accent-soft)}
.htask{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.htask:last-of-type{border-bottom:none}
.htask.done .title{text-decoration:line-through;color:var(--muted)}
.hbravo{color:var(--green);font-weight:600;margin:6px 0}
@media (max-width:700px){.hstats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:26px}.hero .hq{font-size:18px}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.kanban.k5{grid-template-columns:repeat(5,minmax(190px,1fr));overflow-x:auto}
.tag.on{background:var(--accent);color:#fff}
.ideatext{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.rtbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rtbar button{min-width:34px;padding:4px 8px}
.rtbar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.rtwrap{position:relative;display:inline-block}
.rtpop{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:grid;grid-template-columns:repeat(4,30px);gap:6px}
.rtpop[hidden]{display:none}

<body>
<div id="banner"></div>
<header>
  <button id="btnNav" class="mobonly" data-action="navtoggle" title="Menu">☰</button>
  <span class="logo" data-action="nav" data-view="home" style="cursor:pointer" title="Accueil">🧠 Cerveau</span>
  <span class="spacer mobonly"></span>
  <button id="btnSearch" class="mobonly" data-action="searchtoggle" title="Rechercher">🔍</button>
  <input id="capture" placeholder="Noter une idée… (Ctrl+K) puis Entrée" autocomplete="off">
  <input id="search" placeholder="Rechercher… (touche /)" autocomplete="off">
  <button id="btnPostit" data-action="newPostit" title="Nouveau post-it (Alt+N)">🟨 Post-it</button>
  <span id="status" class="muted"></span>
</header>
<main>
  <nav id="nav"></nav>
  <div id="content"></div>
</main>
<div id="navShade" data-action="navclose"></div>
<div id="toast"></div>

<script>
"use strict";
// ---------- Outils ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const tomorrow = () => { const d = new Date(); d.setDate(d.getDate() + 1); return dstr(d); };
const parseTags = s => [...new Set(String(s).split(/[,\s]+/).map(t => t.replace(/^#/, '').trim()).filter(Boolean))];
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); };

// ---------- Données ----------
const emptyData = () => ({ version: 1, updatedAt: 0, inbox: [], notes: [], tasks: [], seen: [], postits: [], boards: [], maps: [], ideas: [], home: {} });
let data = emptyData();
try { const raw = localStorage.getItem('cerveau-data'); if (raw) data = Object.assign(emptyData(), JSON.parse(raw)); } catch (e) {}

let view = 'home', selNote = null, noteFolder = '', importOpen = false, lastNewPostit = null;
let dirHandle = null, saveTimer = null;
const HAS_FS = !!window.showDirectoryPicker;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
// ouvre une image en tenant compte de l'orientation (Safari ancien : repli sans option)
async function loadBitmap(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {}
  try { return await createImageBitmap(file); } catch (e) {}
  return await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { res(im); URL.revokeObjectURL(u); }; im.onerror = rej; im.src = u; });
}

function save() {
  data.updatedAt = Date.now();
  try { localStorage.setItem('cerveau-data', JSON.stringify(data)); } catch (e) {}
  setStatus(dirHandle ? 'Enregistrement…' : 'Enregistré (navigateur seulement)');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeFolder, 700);
}
function setStatus(t) { $('#status').textContent = t; }

// ---------- Dossier de sauvegarde (OneDrive) ----------
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open('cerveau', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => {
      const tx = r.result.transaction('kv', mode);
      const q = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(q && q.result);
      tx.onerror = () => rej(tx.error);
    };
  });
}
const safeName = s => (s || 'sans titre').replace(/[\\/:*?"<>|\r\n]+/g, ' ').trim().slice(0, 50) || 'sans titre';

async function writeFile(dir, name, content) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(content);
  await w.close();
}
async function writeFolder() {
  if (!dirHandle) return;
  try {
    await writeFile(dirHandle, 'data.json', JSON.stringify(data, null, 2));
    const nd = await dirHandle.getDirectoryHandle('notes', { create: true });
    const keep = new Set();
    for (const n of data.notes) {
      const name = safeName(n.title) + '__' + n.id + '.md';
      keep.add(name);
      const head = '---\ntitre: ' + (n.title || '') + '\ndossier: ' + (n.folder || '') + '\ntags: ' + n.tags.join(', ') + '\ncree: ' + fmtDT(n.created) + '\nmodifie: ' + fmtDT(n.updated || n.created) + '\n---\n\n';
      await writeFile(nd, name, head + (n.html ? rteConv(sanitizeHtml(n.html), true) : (n.body || '')));
    }
    for await (const [name] of nd.entries()) if (name.endsWith('.md') && !keep.has(name)) await nd.removeEntry(name);
    let md = '# Tâches\n\n';
    for (const t of data.tasks) {
      md += '- [' + (t.done ? 'x' : ' ') + '] ' + t.title + (t.due ? ' (échéance ' + t.due + ')' : '') + '\n';
      for (const s of t.subs) md += '  - [' + (s.done ? 'x' : ' ') + '] ' + s.title + '\n';
    }
    await writeFile(dirHandle, 'taches.md', md);
    let im = '# Idées\n';
    for (const [k, label] of ICOLS) { const c = data.ideas.filter(i => ideaStatus(i) === k); if (!c.length) continue; im += '\n## ' + label + '\n\n'; for (const i of c) im += '- ' + i.title + (i.tags.length ? ' ' + i.tags.map(t => '#' + t).join(' ') : '') + '\n' + (i.text ? '  ' + i.text.replace(/\n/g, '\n  ') + '\n' : ''); }
    await writeFile(dirHandle, 'idees.md', im);
    let pm = '# Post-it\n\n';
    for (const p of data.postits) if (p.text.trim()) pm += '- ' + p.text.trim().replace(/\n/g, '\n  ') + '\n';
    await writeFile(dirHandle, 'postits.md', pm);
    try { // une image PNG par tableau blanc (facile à partager depuis OneDrive)
      const bd = await dirHandle.getDirectoryHandle('tableaux', { create: true });
      const keepB = new Set();
      for (const b of data.boards) {
        const name = safeName(b.title) + '__' + b.id + '.png'; keepB.add(name);
        if (wbDirty.has(b.id)) { await writeFile(bd, name, await wbBlob(b)); wbDirty.delete(b.id); }
      }
      for await (const [name] of bd.entries()) if (name.endsWith('.png') && !keepB.has(name)) await bd.removeEntry(name);
    } catch (e) { console.error(e); }
    try { // une image + un plan texte (.md, lisible sur iPhone) par carte mentale
      const cd = await dirHandle.getDirectoryHandle('cartes', { create: true });
      const keepC = new Set();
      for (const m of data.maps) {
        const base = safeName(m.title) + '__' + m.id; keepC.add(base + '.png'); keepC.add(base + '.md');
        await writeFile(cd, base + '.md', mmMarkdown(m));
        if (mmDirty.has(m.id)) { await writeFile(cd, base + '.png', await mmBlob(m)); mmDirty.delete(m.id); }
      }
      for await (const [name] of cd.entries()) if (/\.(png|md)$/.test(name) && !keepC.has(name)) await cd.removeEntry(name);
    } catch (e) { console.error(e); }
    try { // les photos de la page d'accueil
      if (homePhotoDirty.size || homePhotoRemoved.size) {
        const ad = await dirHandle.getDirectoryHandle('accueil', { create: true });
        for (const id of [...homePhotoDirty]) { const p = homePhotos.get(id); if (p) await writeFile(ad, 'photo-' + id + '.jpg', p.blob); homePhotoDirty.delete(id); }
        for (const id of [...homePhotoRemoved]) { try { await ad.removeEntry('photo-' + id + '.jpg'); } catch (e) {} homePhotoRemoved.delete(id); }
      }
    } catch (e) { console.error(e); }
    setStatus('Enregistré dans le dossier ✓');
  } catch (e) {
    console.error(e);
    setStatus('⚠ Échec de la sauvegarde dans le dossier');
  }
}
async function readFolder() {
  try {
    const fh = await dirHandle.getFileHandle('data.json');
    const parsed = JSON.parse(await (await fh.getFile()).text());
    if ((parsed.updatedAt || 0) > data.updatedAt) {
      data = Object.assign(emptyData(), parsed);
      localStorage.setItem('cerveau-data', JSON.stringify(data));
      toast('Données chargées depuis le dossier');
    }
  } catch (e) { /* pas encore de data.json : on le créera */ }
  await writeFolder();
  await syncInbox();
  loadHomePhoto();
}
// Idées envoyées depuis l'iPhone : un fichier texte par idée dans le dossier "Inbox-iPhone"
let syncing = false;
async function syncInbox() {
  if (!dirHandle || syncing) return 0;
  syncing = true;
  let added = 0, merged = 0;
  try {
    const dir = await dirHandle.getDirectoryHandle('Inbox-iPhone', { create: true });
    const seen = new Set(data.seen), todo = [];
    for await (const [name, h] of dir.entries()) {
      const ext = (name.match(/\.([A-Za-z][A-Za-z0-9]{0,4})$/) || [])[1]; // une date comme "20.41.35" n'est pas une extension
      if (h.kind !== 'file' || /^[.~]/.test(name) || (ext && !/^(txt|md|text|markdown|json)$/i.test(ext))) continue;
      const f = await h.getFile();
      if (/^json$/i.test(ext || '')) { // sauvegarde envoyée depuis l'iPhone : fusion automatique
        if (!f.size || f.size > 30e6) continue;
        let d; try { d = JSON.parse(await f.text()); } catch (e) { continue; }
        if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.notes)) continue;
        const jk = 'file:' + name + '|' + f.size + '|' + f.lastModified;
        if (!seen.has(jk)) { merged += mergeData(d); seen.add(jk); }
        todo.push([name, f]); continue;
      }
      if (!f.size || f.size > 200000) continue;
      const text = (await f.text()).replace(/^﻿/, '').trim();
      if (!text || /\u0000/.test(text)) continue;
      const key = 'file:' + name + '|' + f.size + '|' + f.lastModified;
      if (!seen.has(key)) { data.inbox.push({ id: uid(), text, created: f.lastModified }); seen.add(key); added++; }
      todo.push([name, f]);
    }
    if (merged) { data.seen = [...new Set([...(data.seen || []), ...seen])]; save(); toast('Sauvegarde de l\'iPhone fusionnée : ' + merged + ' élément(s) ajouté(s) ou mis à jour 📱'); added += merged; }
    if (added && !merged) {
      data.seen = [...seen]; data.inbox.sort((a, b) => b.created - a.created);
      save(); await writeFolder();
      toast(added + " idée(s) reçue(s) de l'iPhone 📱");
    }
    for (const [name, f] of todo) { // les fichiers lus sont rangés dans "importees" (rien n'est perdu)
      try {
        const arch = await dir.getDirectoryHandle('importees', { create: true });
        await writeFile(arch, f.lastModified + '_' + name, f);
        await dir.removeEntry(name);
      } catch (e) { console.error(e); }
    }
  } catch (e) { console.error(e); }
  syncing = false;
  return added;
}
// ----- sauvegarde / fusion (pour iPhone et navigateurs sans dossier)
let pendingImport = null;
function backupBanner() {
  const last = +lsGet('cerveau-lastbackup') || 0, days = last ? Math.floor((Date.now() - last) / 864e5) : null;
  if (isIOS && !navigator.standalone && !lsGet('cerveau-ioshint')) { showBanner('📲 Pour l\'utiliser comme une appli : touche <b>Partager</b> (le carré avec une flèche) puis <b>Sur l\'écran d\'accueil</b>. <button data-action="hidehint">OK</button>'); return; }
  if (days === null || days >= 7) showBanner('💾 Tes données sont uniquement sur cet appareil. ' + (days === null ? 'Aucune sauvegarde pour le moment.' : 'Dernière sauvegarde il y a ' + days + ' jours.') + ' <button class="primary" data-action="share">📤 Sauvegarder</button>');
  else hideBanner();
}
async function shareBackup() {
  const name = 'cerveau-sauvegarde-' + today() + '.json', file = new File([JSON.stringify(data, null, 2)], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Sauvegarde Cerveau' }); lsSet('cerveau-lastbackup', Date.now()); toast('Sauvegarde envoyée ✓'); }
    else { const l = document.createElement('a'); l.href = URL.createObjectURL(file); l.download = name; l.click(); lsSet('cerveau-lastbackup', Date.now()); toast('Sauvegarde téléchargée ✓'); }
  } catch (e) { if (e.name !== 'AbortError') toast('Partage impossible : ' + e.message); }
  backupBanner();
}
function closeImp() { const m = $('#impModal'); if (m) m.remove(); }
function importChoice(d) {
  pendingImport = d; closeImp();
  const m = document.createElement('div'); m.id = 'impModal'; m.className = 'modal';
  m.innerHTML = `<div class="mbox"><h3 style="margin:0 0 8px">Importer cette sauvegarde</h3>
    <p>Elle contient ${d.tasks.length} tâche(s), ${d.notes.length} note(s), ${(d.inbox || []).length} idée(s) dans l'Inbox${(d.ideas || []).length ? ', ' + d.ideas.length + ' idée(s)' : ''}.</p>
    <p class="muted"><b>Fusionner</b> ajoute ce qui manque et garde la version la plus récente de chaque élément (recommandé pour réunir ton téléphone et ton PC). Un élément supprimé d'un côté peut réapparaître. <b>Remplacer</b> efface tout ce qui est ici.</p>
    <div class="row"><button class="primary" data-action="impmerge">Fusionner</button><button data-action="impreplace">Remplacer tout</button><button data-action="impcancel">Annuler</button></div></div>`;
  document.body.appendChild(m);
}
function mergeData(inc) {
  let n = 0; const stamp = x => x.updated || x.doneAt || x.created || 0;
  for (const k of ['inbox', 'notes', 'tasks', 'postits', 'boards', 'maps', 'ideas']) {
    const mine = data[k] || (data[k] = []), by = new Map(mine.map(x => [x.id, x]));
    for (const x of (inc[k] || [])) {
      const cur = by.get(x.id);
      if (!cur) { mine.push(x); n++; }
      else if (stamp(x) > stamp(cur) || (k === 'tasks' && x.done && !cur.done)) { mine[mine.indexOf(cur)] = x; n++; }
    }
  }
  data.seen = [...new Set([...(data.seen || []), ...(inc.seen || [])])];
  const a = data.home || (data.home = {}), b = inc.home || {};
  a.goals = Object.assign({}, b.goals, a.goals); a.quotes = [...new Set([...(a.quotes || []), ...(b.quotes || [])])];
  a.photos = [...new Set([...(a.photos || []), ...(b.photos || [])])];
  for (const k of ['name', 'place', 'lat', 'lon']) if (a[k] == null || a[k] === '') a[k] = b[k];
  data.inbox.sort((x, y) => y.created - x.created); save(); return n;
}
async function pickFolder() {
  if (!window.showDirectoryPicker) { alert("Ce navigateur ne permet pas de choisir un dossier. Utilise Google Chrome."); return; }
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await idb('readwrite', s => s.put(dirHandle, 'dir'));
    hideBanner();
    await readFolder();
    render();

function parseCSV(text, delim) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function parseDate(v) {
  v = String(v || '').trim(); if (!v) return Date.now();
  let m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:[ T,]+(\d{1,2}):(\d{2}))?/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();
  const t = new Date(v).getTime(); return isNaN(t) ? Date.now() : t;
}
function parseIdeas(text) {
  text = String(text || '').replace(/^﻿/, '').trim();
  if (!text) return [];
  const first = text.split(/\r?\n/)[0];
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0];
  if (delim[1] > 1 && /date|id[ée]e|texte|text|contenu|description|titre|idea/i.test(first)) {
    const rows = parseCSV(text, delim[0]);
    const head = rows.shift().map(h => h.trim().toLowerCase());
    let ci = head.findIndex(h => /id[ée]e|texte|text|contenu|description|idea/.test(h));
    if (ci < 0) ci = head.findIndex(h => /titre|title/.test(h));
    if (ci < 0) ci = head.findIndex(h => !/date|heure|time/.test(h));
    const di = head.findIndex(h => /date|created|capture/.test(h));
    return rows.map(r => ({ text: (r[ci] || '').trim(), created: di >= 0 ? parseDate(r[di]) : Date.now() })).filter(x => x.text);
  }
  return text.split(/\r?\n/).map(l => l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim()).filter(Boolean).map(t => ({ text: t, created: Date.now() }));
}
function importIdeas(text) {
  const ideas = parseIdeas(text);
  const seen = new Set(data.seen), key = t => t.trim().toLowerCase();
  let added = 0, skipped = 0;
  for (const i of ideas) {
    if (seen.has(key(i.text))) { skipped++; continue; }
    seen.add(key(i.text)); data.inbox.push({ id: uid(), text: i.text, created: i.created }); added++;
  }
  data.seen = [...seen];
  data.inbox.sort((a, b) => b.created - a.created);
  save(); render();
  toast(added + ' idée(s) importée(s)' + (skipped ? ', ' + skipped + ' déjà connue(s)' : ''));
}

});
document.addEventListener('keydown', e => {
  const el = e.target;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#capture').focus(); $('#capture').select(); return; }
  if (e.key === 'Escape' && $('#ocrModal')) { ocrClose(); return; }
  if (e.altKey && !e.ctrlKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newPostit(); return; }
  if (view === 'board' && !$('#search').value.trim() && !el.isContentEditable && !/INPUT|TEXTAREA|SELECT/.test(el.tagName) && wbKey(e)) return;
  if (view === 'mind' && !$('#search').value.trim() && !/INPUT|TEXTAREA|SELECT/.test(el.tagName)) { if (el.tagName === 'BUTTON') el.blur(); if (mmKey(e)) return; }
  if (e.key === '/' && !el.isContentEditable && !/INPUT|TEXTAREA|SELECT/.test(el.tagName)) { e.preventDefault(); $('#search').focus(); return; }
  if (e.key === 'Escape') { if (el.id === 'search') { clearSearch(); render(); } el.blur && el.blur(); return; }
  if (e.key !== 'Enter') return;
  if (el.id === 'capture') {
    const v = el.value.trim(); if (!v) return;
    data.inbox.unshift({ id: uid(), text: v, created: Date.now() }); el.value = ''; save(); toast('Ajouté à l\'Inbox ✓');
    if (view === 'inbox' && !$('#search').value.trim()) render(); else renderNav();
  } else if (el.id === 'hNewTask') {
    const v = el.value.trim(); if (!v) return;
    addTask(v, today(), 2, []); render(); const a = $('#hNewTask'); if (a) a.focus();
  } else if (el.id === 'newTask') {
    const v = el.value.trim(); if (!v) return;
    addTask(v, $('#newDue').value, $('#newPrio').value, parseTags($('#newTags').value)); render();
  } else if (el.id === 'ideaNew') {
    ideaAddFrom(el, null);
  } else if (el.dataset.iadd) {
    ideaAddFrom(el, el.dataset.iadd);
  } else if (el.dataset.kadd) {
    const v = el.value.trim(); if (!v) return;
    const col = el.dataset.kadd; addTask(v, '', 2, [], col); render();
    const again = document.querySelector(`[data-kadd="${col}"]`); if (again) again.focus();
  } else if (el.dataset.sub) {
    const v = el.value.trim(); if (!v) return;
    data.tasks.find(t => t.id === el.dataset.sub).subs.push({ id: uid(), title: v, done: false }); save(); render();
    const again = document.querySelector(`[data-sub="${el.dataset.sub}"]`); if (again) again.focus();
  }
});

// Appli installable (iPhone/Android) : seulement quand la page est servie en https
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  try { const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l); navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
</script>
</body>
</html>
